<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaayuNetra — Authority Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css?v=2.2" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-shell">

    <!-- ===== TOP NAV (like BreatheairMind) ===== -->
    <header class="topbar">
      <div class="topbar-left">
        <a href="#/" class="brand" data-page="dashboard">
          <div class="brand-icon">V</div>
          <span class="brand-name">VaayuNetra</span>
        </a>
        <nav class="nav-links">
          <a href="#/" class="nav-item active" data-page="dashboard">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span data-i18n="nav_home">Home</span>
          </a>
          <a href="#/map" class="nav-item" data-page="map">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
            <span data-i18n="nav_map">Air Maps</span>
          </a>
          <a href="#/events" class="nav-item" data-page="events">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            <span data-i18n="nav_events">Events</span>
          </a>
          <a href="#/forecast" class="nav-item" data-page="forecast">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
            <span data-i18n="nav_forecast">Forecast</span>
          </a>
          <a href="#/actions" class="nav-item" data-page="actions">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
            <span data-i18n="nav_actions">Actions</span>
          </a>
          <a href="#/advisories" class="nav-item" data-page="advisories">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span data-i18n="nav_advisories">Advisories</span>
          </a>
        </nav>
      </div>
      <div class="topbar-right">
        <!-- Global Hindi / English Language Toggle Bar -->
        <div class="lang-switch-group" id="globalLangSwitch" role="group" aria-label="Language Selector">
          <button type="button" class="lang-pill active" id="langBtnEn" data-lang="en" title="English">
            <span style="font-size:12px;">🌐</span> EN
          </button>
          <button type="button" class="lang-pill" id="langBtnHi" data-lang="hi" title="हिंदी (Hindi)">
            हिन्दी
          </button>
        </div>

        <div class="search-box">
          <input type="text" placeholder="Delhi NCR, India" id="searchInput" />
          <button class="search-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </button>
        </div>
        <button class="icon-btn" id="notifBtn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="user-chip">
          <img src="https://ui-avatars.com/api/?name=Authority+Officer&background=14b8a6&color=fff&size=64" alt="" class="avatar" />
          <span data-i18n="user_role">Authority Officer</span>
        </div>
      </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main id="pageRoot" class="page-root"></main>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="js/data.js?v=2.2"></script>
  <script src="js/app.js?v=2.2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VaayuNetra — Municipal Air Quality & Dispersion Command</title>
  <meta name="description" content="Municipal GIS control interface for real-time air quality monitoring, Gaussian plume dispersion modeling, and receptor vulnerability analysis.">
  
  <!-- Modern Typography: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet GIS Map Styles -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Custom Sleek Lavender Dashboard Theme -->
  <link rel="stylesheet" href="/static/css/dashboard.css">
</head>
<body>
  <div class="dashboard-app">
    
    <!-- 1. Top Navigation Bar -->
    <header class="top-nav">
      <!-- Left: Logo Badge & App Title -->
      <div class="nav-left">
        <div class="brand-badge" id="app-logo-badge" title="VaayuNetra GIS Core">
          <svg viewBox="0 0 24 24">
            <path d="M12 2L3 7v10l9 5 9-5V7l-9-5zm0 3.2L18.4 8 12 11.2 5.6 8 12 5.2zM5 16.5V9.8l6 3v6.7l-6-3zm14 0l-6 3v-6.7l6-3v6.7z"/>
          </svg>
        </div>
        <span class="brand-name">VaayuNetra</span>
      </div>

      <!-- Center: Navigation Links -->
      <nav class="nav-center" aria-label="Main Navigation">
        <a href="#home" class="nav-link active" id="nav-home">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="#airmaps" class="nav-link" id="nav-airmaps">
          <svg viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
          Air Maps
        </a>
        <a href="#events" class="nav-link" id="nav-events">
          <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          Events
        </a>
        <a href="#forecast" class="nav-link" id="nav-forecast">
          <svg viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
          Forecast
        </a>
        <a href="#actions" class="nav-link" id="nav-actions">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          Actions
        </a>
        <a href="#advisories" class="nav-link" id="nav-advisories">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Advisories
        </a>
      </nav>

      <!-- Right: Location Capsule, Search, Notification, User Avatar -->
      <div class="nav-right">
        <div class="location-capsule" id="top-location-capsule">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          <span id="top-location-label">Mumbai, India</span>
        </div>

        <button class="icon-btn" id="btn-search-nav" aria-label="Search region or station" title="Search stations">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>

        <button class="icon-btn" id="btn-notifications-nav" aria-label="Alerts" title="Active plume notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="badge-dot"></span>
        </button>

        <div class="user-chip" id="authority-user-chip" title="Active Municipal Officer Profile">
          <div class="user-avatar">AO</div>
          <span class="user-name">Authority Officer</span>
        </div>
      </div>
    </header>

    <!-- 2. Sub-Header: Region Selector Chips -->
    <section class="region-bar" aria-label="Region Selector">
      <div class="region-label">
        <span class="dot"></span>
        <span>India Region:</span>
      </div>
      <div class="chips-container" id="region-chips-container">
        <button class="region-chip" data-city="Delhi NCR">Delhi NCR</button>
        <button class="region-chip active" data-city="Mumbai">Mumbai</button>
        <button class="region-chip" data-city="Bengaluru">Bengaluru</button>
        <button class="region-chip" data-city="Kolkata">Kolkata</button>
        <button class="region-chip" data-city="Chennai">Chennai</button>
        <button class="region-chip" data-city="Hyderabad">Hyderabad</button>
        <button class="region-chip" data-city="Ahmedabad">Ahmedabad</button>
        <button class="region-chip" data-city="Pune">Pune</button>
        <button class="region-chip" data-city="Lucknow">Lucknow</button>
        <button class="region-chip" data-city="Patna">Patna</button>
      </div>
    </section>

    <!-- 3. Main Body Content -->
    <main class="main-content">
      
      <!-- Interactive Map Area with Floating View Options -->
      <section class="map-panel" aria-label="GIS Dispersion and Telemetry Map">
        <div id="map"></div>

        <!-- Floating "View Options" Glass Card -->
        <div class="view-options-card" id="view-options-card">
          <div class="view-options-header">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>View Options</span>
          </div>

          <div class="options-section-title">Pollutant</div>

          <div class="options-list">
            <label class="option-checkbox-row">
              <span>PM2.5</span>
              <input type="checkbox" id="chk-pm25" checked>
            </label>
            <label class="option-checkbox-row">
              <span>PM10</span>
              <input type="checkbox" id="chk-pm10" checked>
            </label>
            <label class="option-checkbox-row">
              <span>O₃</span>
              <input type="checkbox" id="chk-o3">
            </label>
            <label class="option-checkbox-row">
              <span>NO₂</span>
              <input type="checkbox" id="chk-no2">
            </label>
            <label class="option-checkbox-row">
              <span>AQI Color Area</span>
              <input type="checkbox" id="chk-aqi-area" checked>
            </label>
          </div>

          <div class="view-options-actions">
            <button class="btn-options-cancel" id="btn-cancel-options">Cancel</button>
            <button class="btn-options-apply" id="btn-apply-options">Apply</button>
          </div>
        </div>

        <!-- Pitch Demo Spike Pill Button -->
        <button class="pitch-action-pill" id="pitch-demo-spike-btn" title="Simulate agricultural stubble burning spike">
          <svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
          Pitch Demo Spike
        </button>
      </section>

      <!-- 4. Bottom Telemetry & Forecast Row -->
      <section class="telemetry-row">
        
        <!-- Left Card: City AQI Gauge -->
        <article class="panel-card gauge-card" id="city-aqi-card">
          <div class="gauge-header">
            <h2 class="gauge-city-title" id="gauge-city-name">Mumbai</h2>
            <div class="gauge-sub-location" id="gauge-sub-loc">IN India • Maharashtra</div>
          </div>

          <!-- Circular SVG AQI Progress Ring -->
          <div class="gauge-ring-container">
            <svg class="gauge-svg" viewBox="0 0 140 140">
              <!-- Background Track -->
              <circle class="gauge-track" cx="70" cy="70" r="54" />
              <!-- Gradient Progress Arc -->
              <circle class="gauge-progress" id="gauge-svg-progress" cx="70" cy="70" r="54" />
            </svg>
            <div class="gauge-inner-content">
              <span class="gauge-aqi-number" id="gauge-aqi-val">142</span>
              <span class="gauge-aqi-label">AQI</span>
            </div>
          </div>

          <!-- Status Badge -->
          <div class="gauge-status-pill moderate" id="gauge-status-pill">
            Moderate
          </div>

          <!-- Weather & Wind Telemetry -->
          <div class="gauge-telemetry-meta" id="gauge-telemetry-meta">
            <span>💨 E 2.1 m/s</span> • <span>🌡️ 30°C</span>
          </div>
        </article>

        <!-- Right Card: Air Quality Forecast -->
        <article class="panel-card forecast-card" id="forecast-card">
          <div class="forecast-top">
            <h2 class="forecast-title" id="forecast-chart-title">Air Quality Forecast — Mumbai</h2>
            
            <div class="forecast-tabs" role="tablist">
              <button class="forecast-tab active" data-mode="hourly" role="tab">Hourly</button>
              <button class="forecast-tab" data-mode="daily" role="tab">Daily</button>
              <button class="forecast-tab" data-mode="monthly" role="tab">Monthly</button>
            </div>
          </div>

          <!-- 24-Hour Line Chart -->
          <div class="chart-container">
            <canvas id="forecastChart"></canvas>
          </div>
        </article>

      </section>

    </main>

  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Dashboard Logic -->
  <script src="/static/js/dashboard.js"></script>
</body>
</html>
